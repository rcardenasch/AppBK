{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow rounded-4 border-0">
        <div class="card-header bg-white py-3 border-bottom-0">
            <h4 class="mb-0 fw-bold text-secondary">
                <i class="bi bi-sliders me-2 text-primary"></i>
                {% if configuracion %}Editar{% else %}Nueva{% endif %} Configuración
            </h4>
        </div>

        <div class="card-body">
            <form method="post">
                <div class="row g-3">
                    <!-- Aporte Mínimo -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-muted">Aporte Mínimo S/</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="aporte_minimo"
                            value="{{ configuracion.aporte_minimo if configuracion else '' }}" required>
                    </div>

                    <!-- Sobre por Acción -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-muted">Sobre por Acción S/</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="sobre_por_accion"
                            value="{{ configuracion.sobre_por_accion if configuracion else '' }}" required>
                    </div>

                    <!-- Interés Mensual -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-muted">Interés Mensual %</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="interes_mensual"
                            value="{{ configuracion.interes_mensual if configuracion else '' }}" required>
                    </div>

                    <!-- Método de Distribución -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-muted">Método Distribución</label>
                        <input type="text" maxlength="20" class="form-control" name="metodo_distribucion"
                            value="{{ configuracion.metodo_distribucion if configuracion else '' }}" placeholder="Ej: Proporcional" required>
                    </div>

                    <!-- Multa Tardanza -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-muted">Multa Tardanza S/</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-clock"></i></span>
                            <input type="number" step="0.01" min="0" class="form-control" name="multa_tardanza"
                                value="{{ configuracion.multa_tardanza if configuracion else '' }}" required>
                        </div>
                    </div>

                    <!-- Multa Falta -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-muted">Multa Falta S/</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-x-circle"></i></span>
                            <input type="number" step="0.01" min="0" class="form-control" name="multa_falta"
                                value="{{ configuracion.multa_falta if configuracion else '' }}" required>
                        </div>
                    </div>

                    <!-- Estado -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-muted">Estado</label>
                        <select class="form-select" name="estado">
                            <option value="1" {% if configuracion and (configuracion.estado == True or configuracion.estado == 1) %}selected{% endif %}>Activo</option>
                            <option value="0" {% if configuracion and (configuracion.estado == False or configuracion.estado == 0) %}selected{% endif %}>Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4 pt-3 border-top">
                    <button type="submit" class="btn btn-primary px-4 shadow-sm">
                        <i class="bi bi-save me-1"></i> Guardar
                    </button>
                    <a href="{{ url_for('configuracion.index') }}" class="btn btn-outline-secondary px-4">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
