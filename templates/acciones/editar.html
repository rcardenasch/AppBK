{% extends "base.html" %}

{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <h5>
            <i class="bi bi-box"></i>
            Editar acción
        </h5>
    </div>

    <div class="card-body">
        <!-- Corregido: Ahora apunta a la ruta unificada acciones.editar -->
        <form method="post" action="{{ url_for('acciones.editar', id=accion.id) }}">
            
            <div class="mb-3">
                <label class="form-label">Socio</label>
                <!-- Input oculto para enviar el ID al servidor sin que sea editable -->
                <input type="hidden" name="socio_id" value="{{ accion.socio_id }}">
                <!-- Muestra el nombre completo del socio de forma legible y protegida -->
                <input type="text" class="form-control" value="{{ accion.socio.nombres }} {{ accion.socio.apellidos }}" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label">Número de acción</label>
                <input type="text" name="numero_accion" value="{{ accion.numero_accion }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Valor acción</label>
                <input type="number" step="0.01" name="valor" value="{{ accion.valor }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Estado</label>

                <!-- Opción Activa (Evaluación por texto para coincidir con tu BD) -->
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="estado" id="estadoActivo" value="ACTIVO" 
                        {% if accion.estado == 'ACTIVO' %}checked{% endif %} required>
                    <label class="form-check-label" for="estadoActivo">Activo</label>
                </div>

                <!-- Opción Inactiva -->
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="estado" id="estadoInactivo" value="INACTIVO" 
                        {% if accion.estado == 'INACTIVO' %}checked{% endif %} required>
                    <label class="form-check-label" for="estadoInactivo">Inactivo</label>
                </div>
            </div>

            <button type="submit" class="btn btn-success">
                Guardar Cambios
            </button>
            
            <a href="{{ url_for('acciones.index') }}" class="btn btn-secondary">
                Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
