<div
    class="modal fade"
    id="modalNuevo"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content border-0 shadow">

            <form
                method="POST"
                action="{{ url_for('usuarios.guardar') }}">

                <div class="modal-header bg-primary text-white">

                    <h5 class="modal-title">

                        <i class="bi bi-person-plus-fill me-2"></i>

                        Nuevo Usuario

                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Nombres

                            </label>

                            <input
                                type="text"
                                name="nombres"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Usuario

                            </label>

                            <input
                                type="text"
                                name="usuario"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Correo

                            </label>

                            <input
                                type="email"
                                name="correo"
                                class="form-control">

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Rol

                            </label>

                            <select
                                class="form-select"
                                name="rol_id"
                                required>

                                <option value="">

                                    Seleccione...

                                </option>

                                {% for rol in roles %}

                                <option value="{{rol.id}}">

                                    {{rol.nombre}}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Contraseña

                            </label>

                            <div class="input-group">

                                <input
                                    id="password"
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    required>

                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    id="mostrarPassword">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Confirmar

                            </label>

                            <input
                                id="confirmar"
                                type="password"
                                class="form-control"
                                required>

                        </div>

                    </div>

                    <div
                        id="passwordError"
                        class="text-danger small">
                    </div>

                </div>



                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                        class="btn btn-primary">

                        <i class="bi bi-save"></i>

                        Guardar

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
