<div
    class="modal fade"
    id="modalPassword"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <form
                id="formPassword"
                method="POST">

                <div class="modal-header bg-secondary text-white">

                    <h5>

                        <i class="bi bi-key-fill"></i>

                        Restablecer contraseña

                    </h5>

                    <button
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <div class="mb-3">

                        <label>

                            Nueva contraseña

                        </label>

                        <input
                            id="nuevaPassword"
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>

                            Confirmar contraseña

                        </label>

                        <input
                            id="confirmarPassword"
                            type="password"
                            class="form-control"
                            required>

                    </div>

                    <div
                        id="errorPassword"
                        class="text-danger">
                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                        class="btn btn-primary">

                        Guardar

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
