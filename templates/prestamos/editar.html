{% extends "base.html" %}

{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
            <i class="bi bi-cash-stack"></i>
            Editar préstamo
        </h5>
    </div>

    <div class="card-body">
        <form method="post">
            <!-- 1. SELECCIONAR SOCIO FIRST -->
            <div class="mb-3">
                <label for="socio" class="form-label">Socio</label>
                <select id="socio" class="form-select" required>
                    <option value="">Seleccione un socio</option>
                    {% for socio in socios %}
                    <option value="{{ socio.id }}">{{ socio.nombres }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- 2. SELECCIONAR ACCIÓN (Se llena con JS) -->
            <select name="accion_id" class="form-select">

                {% for accion in acciones %}

                <option value="{{ accion.id }}" {% if accion.id==prestamo.accion_id %}selected{% endif %}>

                    {{ accion.socio.nombres }}
                    -
                    {{ accion.numero_accion }}

                </option>

                {% endfor %}

            </select>

            <!-- 3. MONTO -->
            <div class="mb-3">
                <label class="form-label">Monto préstamo</label>
                <input type="number" step="0.01" name="monto" class="form-control" required>
            </div>

            <!-- 4. INTERÉS -->
            <div class="mb-3">
                <label class="form-label">Interés mensual</label>
                <!-- Removido el símbolo % del value para no enviar texto basura al backend si usas este input -->
                <input class="form-control" value="{{ interes }}" readonly>
            </div>

            <!-- BOTONES -->
            <button type="submit" class="btn btn-success">Guardar préstamo</button>
            <a href="{{ url_for('prestamos.index') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>

{% block scripts %}
<script>
    $("#socio").change(function () {
        let socio = $(this).val();
        let combo = $("#accion");

        combo.empty();

        if (socio == "") {
            combo.append("<option value=''>Primero seleccione un socio</option>");
            return;
        }

        combo.append("<option>Cargando...</option>");

        $.get("/prestamos/acciones/" + socio, function (data) {
            combo.empty();

            if (data.length == 0) {
                combo.append("<option value=''>No existen acciones disponibles</option>");
                return;
            }

            combo.append("<option value=''>Seleccione...</option>");
            data.forEach(function (a) {
                combo.append(`
                <option value="${a.id}">
                    ${a.numero} - Valor S/ ${a.valor}
                </option>
            `);
            });
        });
    });
</script>
{% endblock %}
{% endblock %}
