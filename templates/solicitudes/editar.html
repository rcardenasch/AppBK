{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            
            <div class="card shadow-sm border-0 rounded-4">
                <!-- Header con estilo moderno e iconos -->
                <div class="card-header bg-warning text-dark py-3 border-bottom-0 rounded-top-4 d-flex align-items-center justify-content-between">
                    <h5 class="card-title mb-0 fw-bold d-flex align-items-center gap-2">
                        <i class="bi bi-pencil-square fs-4 text-dark"></i>
                        Editar Solicitud de Préstamo
                    </h5>
                    <span class="badge bg-dark bg-opacity-10 text-dark border border-dark border-opacity-10 fw-mono small">
                        ID: #{{ solicitud.id }}
                    </span>
                </div>

                <div class="card-body p-4">
                    <form method="post" autocomplete="off">
                        
                        <div class="row g-3">
                            <!-- Periodo -->
                            <div class="col-md-6">
                                <label for="periodo_id" class="form-label small text-muted fw-semibold text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">
                                    Periodo
                                </label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-body-secondary border-secondary-subtle text-secondary"><i class="bi bi-calendar3"></i></span>
                                    <select id="periodo_id" name="periodo_id" class="form-select border-secondary-subtle fw-medium" required>
                                        {% for p in periodos %}
                                        <option value="{{p.id}}" {% if p.id == solicitud.periodo_id %}selected{% endif %}>
                                            {{p.anio}} - {{"%02d"|format(p.mes)}}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <!-- Monto Solicitado -->
                            <div class="col-md-6">
                                <label for="monto" class="form-label small text-muted fw-semibold text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">
                                    Monto Solicitado
                                </label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-body-secondary border-secondary-subtle fw-bold text-success">S/</span>
                                    <input type="number" step="0.01" min="0.01" id="monto" name="monto" value="{{ solicitud.monto_solicitado }}" class="form-control border-secondary-subtle fw-bold text-dark text-end" placeholder="0.00" required>
                                </div>
                            </div>

                            <!-- Socio -->
                            <div class="col-md-6">
                                <label for="socio" class="form-label small text-muted fw-semibold text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">
                                    Socio Solicitante
                                </label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-body-secondary border-secondary-subtle text-secondary"><i class="bi bi-person-fill"></i></span>
                                    <select id="socio" name="socio_id" class="form-select border-secondary-subtle" required>
                                        {% for s in socios %}
                                        <option value="{{s.id}}" {% if s.id == solicitud.socio_id %}selected{% endif %}>
                                            {{s.nombres}}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <!-- Acción asociada -->
                            <div class="col-md-6">
                                <label for="accion" class="form-label small text-muted fw-semibold text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">
                                    Acción Vinculada
                                </label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-body-secondary border-secondary-subtle text-secondary"><i class="bi bi-gem"></i></span>
                                    <select id="accion" name="accion_id" class="form-select border-secondary-subtle" required>
                                        {% for a in acciones %}
                                        <option value="{{a.id}}" {% if a.id == solicitud.accion_id %}selected{% endif %}>
                                            Acción N° {{a.numero_accion}}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Botones de Acción -->
                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-light-subtle">
                            <a href="{{ url_for('solicitudes.index') }}" class="btn btn-light border-secondary-subtle btn-sm px-3 fw-medium">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-success btn-sm px-4 fw-bold shadow-sm">
                                <i class="bi bi-check-lg me-1"></i> Guardar Cambios
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
document.getElementById("socio").addEventListener("change", function () {
    const socioId = this.value;
    const comboAccion = document.getElementById("accion");

    if (!socioId) {
        comboAccion.innerHTML = '<option value="">Seleccione primero un socio...</option>';
        comboAccion.disabled = true;
        return;
    }

    comboAccion.innerHTML = '<option value="">Cargando acciones...</option>';
    comboAccion.disabled = true;

    fetch("/solicitudes/acciones/" + socioId)
        .then(r => {
            if (!r.ok) throw new Error("Error en el servidor");
            return r.json();
        })
        .then(data => {
            comboAccion.innerHTML = "";
            
            if (data.acciones && data.acciones.length > 0) {
                data.acciones.forEach(a => {
                    const opt = document.createElement("option");
                    opt.value = a.id;
                    // Se usa a.numero (o a.numero_accion si mapeas diferente en tu JSON del API)
                    opt.textContent = `Acción N° ${a.numero || a.numero_accion}`;
                    comboAccion.appendChild(opt);
                });
                comboAccion.disabled = false;
            } else {
                comboAccion.innerHTML = '<option value="">El socio no cuenta con acciones disponibles</option>';
            }
        })
        .catch(err => {
            console.error(err);
            comboAccion.innerHTML = '<option value="">Error al cargar acciones</option>';
        });
});
</script>
{% endblock %}
